# A Dash plugin. Build, test, zip and index it with: TEST=1 scripts/build-plugins.sh SRE
name: SREPlugin
options:
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
packages:
  DashKit: { path: "${DASH_ROOT}/Packages/DashKit" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  SREPlugin:
    type: bundle
    platform: macOS
    sources:
      - Sources
      - path: plugin.json       # the bundle describes itself (Contents/Resources/plugin.json)
        buildPhase: resources
      - path: Rules                     # default rules for Dashii, as Markdown (Contents/Resources/Rules/<id>.md)
        type: folder
        buildPhase: resources
    dependencies:
      - package: DashKit
        product: DashKit
        embed: false            # Dash provides DashKit at runtime
    info:
      path: Info.plist
      properties:
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        DashPluginID: sre
        DashPluginVersion: "1.3.2"
        DashKitMinimumVersion: "2.4.0"
    settings:
      base:
        WRAPPER_EXTENSION: dashplugin
        PRODUCT_BUNDLE_IDENTIFIER: dev.sessaidi.Dash.plugin.sre
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../../../../Frameworks"
    scheme: {}
  SREPluginTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources
      - Tests
      - path: Rules                   # the rules load from the bundle the code runs in
        type: folder
        buildPhase: resources
    dependencies:
      - package: DashKit
        product: DashKit      # includes DashKitTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sessaidi.Dash.plugin.sre.tests
    scheme:
      testTargets: [SREPluginTests]
