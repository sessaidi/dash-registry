# Standalone project for building and testing the plugin from plugins/JiraBoard.
# Jira Board is a feature: it reaches the `atlassian` integration (plugins/Atlassian) only
# through DashKit (`host.integration("atlassian")`), never by importing its types.
name: JiraBoardPlugin
options:
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
packages:
  DashKit: { path: "${DASH_ROOT}/Packages/DashKit" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  JiraBoardPlugin:
    type: bundle
    platform: macOS
    sources:
      - Sources
      - path: plugin.json               # the bundle describes itself (Contents/Resources/plugin.json)
        buildPhase: resources
      - path: Rules                     # default rules for Claude, as Markdown (Contents/Resources/Rules/<id>.md)
        type: folder
        buildPhase: resources
    dependencies:
      - package: DashKit
        product: DashKit
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        DashPluginID: jira-board
        DashPluginVersion: "1.14.0"
        DashKitMinimumVersion: "2.0.0"
    settings:
      base:
        WRAPPER_EXTENSION: dashplugin
        PRODUCT_BUNDLE_IDENTIFIER: dev.sessaidi.Dash.plugin.jira-board
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../../../../Frameworks"
  JiraBoardPluginTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources
      - Tests
      - path: Rules                   # the rules load from the bundle the code runs in
        type: folder
        buildPhase: resources
    dependencies:
      - package: DashKit
        product: DashKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sessaidi.Dash.plugin.jira-board.tests
schemes:
  JiraBoardPlugin:
    build:
      targets: { JiraBoardPlugin: all }
  JiraBoardPluginTests:
    build:
      targets: { JiraBoardPluginTests: [test] }
    test:
      targets: [JiraBoardPluginTests]
